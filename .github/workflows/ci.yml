# Her push ve pull request'te backend (pytest) ve frontend (node --test) testleri çalışır.
# Testler gerçek veritabanına ve SportsAPI'ye dokunmaz: geçici SQLite kullanılır, ağ isteği yok.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend testleri (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend testleri (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript sözdizimi
        run: for f in frontend/js/*.js; do node --check "$f"; done
      - run: node --test "frontend/tests/*.test.cjs"
